; ============================================================================
;  Zwift Remote — firmware for the LilyGO T-Display S3 Pro
;  (ESP32-S3R8: 16MB flash / 8MB PSRAM, ST7796 display, CST226SE touch)
;
;  A BLE HID keyboard: physical/touch buttons type Zwift's keyboard shortcuts
;  onto the paired computer (T = garage, Esc = menu, ...).
;
;  Board profile reused from the tdisplay bring-up project (Stages 1-14).
; ============================================================================

[env:zwift-remote]
; --- Chip family + build system (identical to the bring-up project) ---
;  pioarduino platform = the MODERN ESP32 Arduino core 3.x (resolves to 3.3.9).
;  The BLE-keyboard library below needs core >= 3.3.7 and NimBLE 2.x, so this
;  modern core is a hard requirement, not just a preference.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-s3-devkitm-1
framework = arduino

; --- Flash chip settings (must match the 16MB on this board) ---
board_build.mcu         = esp32s3
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB

; --- QIO flash + OPI (octal) PSRAM: needed for the 8MB PSRAM ---
board_build.arduino.memory_type = qio_opi

; --- Serial console over the S3's *native* USB port (for debugging) ---
;  BLE-HID and USB-CDC-serial coexist happily: USB is only the debug console,
;  the keyboard goes out over Bluetooth. No USB-HID here.
build_flags =
	-DARDUINO_USB_MODE=1        ; use the built-in USB peripheral
	-DARDUINO_USB_CDC_ON_BOOT=1 ; expose it as a serial port at startup
	-DBOARD_HAS_PSRAM           ; enable the 8MB PSRAM

monitor_speed = 115200

; --- Libraries ---
;  Stage 1 needs ONLY the BLE keyboard (no display yet). We add the display /
;  touch / power libraries in later stages, one at a time, to keep each build
;  focused. NimBLE is pinned because this project is pure-NimBLE (no Bluedroid).
lib_deps =
	hijelhub/HijelHID_BLEKeyboard
	h2zero/NimBLE-Arduino@^2.3.8
